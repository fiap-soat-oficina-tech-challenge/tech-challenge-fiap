# Análise no SonarQube Cloud, feita pelo CI (.github/workflows/ci.yml) depois
# dos testes: os relatórios de cobertura dos unitários (coverage/lcov.info) e
# dos e2e (coverage-e2e/lcov.info) são enviados juntos, e o quality gate decide
# se o job Build & Test passa.
sonar.organization=fiap-soat-oficina-tech-challenge
sonar.projectKey=fiap-soat-oficina-tech-challenge_tech-challenge-fiap
sonar.projectName=tech-challenge-fiap

# Código de produção em src/. Testes: unitários (*.spec.ts em src/), e2e, BDD e
# integração em test/, e o dublê do cliente Prisma em src/__mocks__/.
sonar.sources=src
sonar.exclusions=**/*.spec.ts,src/__mocks__/**,src/generated/**
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,src/__mocks__/**,test/**

# Cobertura: unitários e e2e somados (os repositórios Prisma só são exercitados
# pelos e2e), com as mesmas exclusões do collectCoverageFrom do Jest.
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage-e2e/lcov.info
sonar.coverage.exclusions=src/main.ts,**/*.module.ts,**/index.ts

# O job espera o resultado do quality gate e falha se ele reprovar.
sonar.qualitygate.wait=true
